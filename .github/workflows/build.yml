
name: Build LiBwrt Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
         

      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Check disk space
        run: |
          df -h
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libpython3-dev \
            libreadline-dev libtool-bin libusb-1.0-0-dev \
            msmtp nano ninja-build p7zip-full patch \
            pkgconf qemu-utils subversion swig \
            texinfo uglifyjs upx-ucl xmlto xxd
          sudo apt-get clean
          df -h

      - name: Clone latest LiBwrt source
        run: |
          git clone --depth 1 --single-branch \
            -b 25.12-nss \
            https://github.com/LiBwrt/LibWrt.git \
            openwrt


     
      - name: Apply configuration
        run: |
          set -e
          cp .config openwrt/.config
          cd openwrt

          echo "===== 1. Target and package config before feeds ====="
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(luci-app-weechat|weechat-full|weechat-minimal|luci-app-openlist|openlist|luci-app-dae|dae)=)' .config || true

          echo "===== 2. Update and install feeds ====="
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "===== 3. Check package definitions ====="
          find package/feeds feeds package \
            \( -iname '*openlist*' -o -iname '*dae*' -o -iname '*weechat*' \) \
            2>/dev/null | sort -u | head -150 || true

          echo "===== 4. Check generated Kconfig dependencies ====="
          if [ -f tmp/.config-package.in ]; then
            grep -n -B 5 -A 10 -E \
              'PACKAGE_luci-app-weechat|PACKAGE_weechat-full|PACKAGE_weechat-minimal' \
              tmp/.config-package.in || true
          else
            echo "tmp/.config-package.in does not exist yet"
          fi

          echo "===== 5. Save config before defconfig ====="
          cp .config /tmp/config.before-defconfig

          echo "===== 6. Run defconfig and capture exit code ====="
          set +e
          make defconfig 2>&1 | tee /tmp/make-defconfig.log
          defconfig_status=${PIPESTATUS[0]}
          set -e

          echo "make defconfig exit code: ${defconfig_status}"

          echo "===== 7. Package config after defconfig ====="
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(luci-app-weechat|weechat-full|weechat-minimal|luci-app-openlist|openlist|luci-app-dae|dae)=)' .config || true

          echo "===== 8. Relevant config differences ====="
          diff -u /tmp/config.before-defconfig .config \
            | grep -E '^[+-].*(TARGET|openlist|dae|weechat)' || true

          echo "===== 9. Kconfig error summary ====="
          grep -ni -E 'recursive dependency|error:|warning:' \
            /tmp/make-defconfig.log | head -100 || true

          echo "===== 10. Defconfig result ====="
          if [ "$defconfig_status" -ne 0 ]; then
            echo "ERROR: make defconfig failed"
            exit "$defconfig_status"
          fi

          echo "make defconfig returned success; inspect package selections above."



      - name: Download sources
        run: |
          cd openwrt
#          make download -j4

      - name: Compile firmware
        run: |
          cd openwrt
#          make -j$(nproc) V=s

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiBwrt-firmware
          path: |
            openwrt/bin/targets/
          if-no-files-found: warn
          retention-days: 7
