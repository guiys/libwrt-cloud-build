
name: Build LiBwrt Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Initialization Environment
        run: |
          # 删除 Docker 镜像
          docker images -q | xargs -r sudo docker rmi -f || true

          # 清理预装的大型开发环境
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # 卸载当前固件编译不需要的软件
          sudo apt-get purge -y \
            'azure-cli' 'ghc*' 'zulu*' 'llvm*' \
            'firefox*' 'google*' 'dotnet*' \
            'powershell*' 'openjdk*' 'mongodb*' \
            'moby*' || true

          sudo apt-get autoremove --purge -y
          sudo apt-get clean

          echo "===== Disk before expansion ====="
          df -hT

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Check disk after expansion
        run: |
          df -hT
          df -ih
         

      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Check disk space
        run: |
          df -h
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libpython3-dev \
            libreadline-dev libtool-bin libusb-1.0-0-dev \
            msmtp nano ninja-build p7zip-full patch \
            pkgconf qemu-utils subversion swig \
            texinfo uglifyjs upx-ucl xmlto xxd
          sudo apt-get clean
          df -h

      - name: Clone latest LiBwrt source
        run: |
          git clone --depth 1 --single-branch \
            -b 25.12-nss \
            https://github.com/LiBwrt/LibWrt.git \
            openwrt
            sed -i 's#^src-git packages .*#src-git packages https://github.com/immortalwrt/packages.git;master#' openwrt/feeds.conf.default

      - name: Prepare cache directories
        run: |
          mkdir -p openwrt/dl openwrt/.ccache


      - name: Cache C/C++ compiler
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: openwrt-ccache-ipq807x-${{ hashFiles('.config') }}
          restore-keys: |
            openwrt-ccache-ipq807x-

    
      - name: Apply configuration
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ -L package/feeds/luci/luci-app-weechat ]; then
           rm package/feeds/luci/luci-app-weechat
          fi

          cp ../.config .config

          grep -q '^CONFIG_CCACHE=y$' .config || echo 'CONFIG_CCACHE=y' >> .config

          make defconfig

          grep -E '^CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=y$' .config
      - name: Download sources
        run: |
          cd openwrt
          make download -j4

      - name: Compile firmware
        run: |
          cd openwrt
          export CCACHE_DIR="$PWD/.ccache"
          ccache -M 1G
          ccache -s
          make -j$(nproc)
          ccache -s

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiBwrt-firmware
          path: |
            openwrt/bin/targets/
          if-no-files-found: warn
          retention-days: 7
