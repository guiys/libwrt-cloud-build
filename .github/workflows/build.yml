
name: Build LiBwrt Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
         

      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Check disk space
        run: |
          df -h
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libpython3-dev \
            libreadline-dev libtool-bin libusb-1.0-0-dev \
            msmtp nano ninja-build p7zip-full patch \
            pkgconf qemu-utils subversion swig \
            texinfo uglifyjs upx-ucl xmlto xxd
          sudo apt-get clean
          df -h

      - name: Clone latest LiBwrt source
        run: |
          git clone --depth 1 --single-branch \
            -b 25.12-nss \
            https://github.com/LiBwrt/LibWrt.git \
            openwrt
     
      - name: Diagnose feed installation
        run: |
          set -e
          cp .config openwrt/.config
          cd openwrt

          echo "===== A. Before feeds update ====="
          sha256sum .config
          grep -n -E 'CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=' .config || true

          ./scripts/feeds update -a

          echo "===== B. After feeds update ====="
          sha256sum .config
          grep -n -E 'CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=' .config || true

          ./scripts/feeds install -a

          echo "===== C. After feeds install ====="
          sha256sum .config
          ls -l .config
          grep -n -E 'CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=' .config || true

          echo "===== D. Installed package links ====="
          ls -ld package/feeds/luci/luci-app-openlist \
                 package/feeds/luci/luci-app-dae \
                 package/feeds/packages/openlist \
                 package/feeds/packages/dae || true

          echo "===== E. Package Makefile config definitions ====="
          grep -n -E '^(define Package/(luci-app-openlist|luci-app-dae|openlist|dae)(/[^)]*)?|config PACKAGE_)' \
            feeds/luci/applications/luci-app-openlist/Makefile \
            feeds/luci/applications/luci-app-dae/Makefile \
            feeds/packages/net/openlist/Makefile \
            feeds/packages/net/dae/Makefile || true

      - name: Download sources
        run: |
          cd openwrt
#          make download -j4

      - name: Compile firmware
        run: |
          cd openwrt
#          make -j$(nproc) V=s

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiBwrt-firmware
          path: |
            openwrt/bin/targets/
          if-no-files-found: warn
          retention-days: 7
