
name: Build LiBwrt Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
         

      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Check disk space
        run: |
          df -h
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libpython3-dev \
            libreadline-dev libtool-bin libusb-1.0-0-dev \
            msmtp nano ninja-build p7zip-full patch \
            pkgconf qemu-utils subversion swig \
            texinfo uglifyjs upx-ucl xmlto xxd
          sudo apt-get clean
          df -h

      - name: Clone latest LiBwrt source
        run: |
          git clone --depth 1 --single-branch \
            -b 25.12-nss \
            https://github.com/LiBwrt/LibWrt.git \
            openwrt
      - name: Apply configuration
        run: |
          set -e
          cp .config openwrt/.config
          cd openwrt

          echo "===== A. Immediately after copying config ====="
          grep -E '^(CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=|# CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae) is not set)' .config || true

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "===== B. After feeds install ====="
          grep -E '^(CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=|# CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae) is not set)' .config || true

          echo "===== C. Package symbols in generated config ====="
          grep -n -E 'PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)' tmp/.config-package.in 2>/dev/null | head -80 || true

          echo "===== D. Run defconfig ====="
          make defconfig

          echo "===== E. After defconfig ====="
          grep -E '^(CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae)=|# CONFIG_PACKAGE_(luci-app-openlist|openlist|luci-app-dae|dae) is not set)' .config || true

     
     
      - name: Download sources
        run: |
          cd openwrt
#          make download -j4

      - name: Compile firmware
        run: |
          cd openwrt
#          make -j$(nproc) V=s

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiBwrt-firmware
          path: |
            openwrt/bin/targets/
          if-no-files-found: warn
          retention-days: 7
